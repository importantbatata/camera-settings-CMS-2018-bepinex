name: Publish Camera Settings releases
on:
  push:
    branches: [main]
    paths: ['.github/workflows/publish-camera-releases.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Publish five releases in version order and verify downloads
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 .github/publish-camera-releases.py
